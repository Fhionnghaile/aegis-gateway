services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","1G","--kafka-addr","PLAINTEXT://0.0.0.0:9092","--advertise-kafka-addr","PLAINTEXT://redpanda:9092"]
    ports: ["9092:9092"]
  gateway:
    build: {context: ".", args: {}}
    # build with the kafka tag for the real sink:  docker build --build-arg TAGS=kafka
    environment:
      AEGIS_ADDR: ":8080"
      # /metrics listens on 9091 inside the compose network only (not published to the host):
      # Prometheus scrapes it; event senders cannot reach it.
      AEGIS_ADMIN_ADDR: ":9091"
      AEGIS_KAFKA_BROKERS: "redpanda:9092"
      AEGIS_TOPIC: "events"
      AEGIS_QUEUE_CAP: "100000"
      AEGIS_WORKERS: "8"
      # Guard: block a client after 20 invalid events in 10 s. It keys on the TCP peer address, so
      # behind a load balancer (one peer for everyone) turn it off with 0. CI sets 0 for the load test.
      AEGIS_GUARD_THRESHOLD: "${AEGIS_GUARD_THRESHOLD:-20}"
    ports: ["8080:8080"]
    depends_on: [redpanda]
  responder:
    # Detection -> containment: blocks hostile senders at the gateway via its internal admin listener.
    build: {context: "."}
    entrypoint: ["/responder"]
    environment:
      AEGIS_ADMIN_URL: "http://gateway:9091"
      AEGIS_RESPONDER_ADDR: ":9092"
    ports: ["127.0.0.1:9092:9092"]
    depends_on: [gateway]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"}
    ports: ["3000:3000"]
    depends_on: [prometheus]
