name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "48 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go vet ./...
      - run: go test ./... -race
      - run: go build ./cmd/gateway
