name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "48 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.24' }
      - run: go vet ./...
      - run: go test ./... -race
      - run: go build ./cmd/gateway ./cmd/responder
